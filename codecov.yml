component_management:
  individual_components:
    - component_id: core
      name: Core
      paths:
        - src/ManagedDrive.Core/**
        - src/ManagedDrive.Cli.Core/**
    - component_id: app
      name: App
      paths:
        - src/ManagedDrive.App/**

coverage:
  status:
    project:
      default: false
      core:
        paths:
          - src/ManagedDrive.Core/**
          - src/ManagedDrive.Cli.Core/**
      app:
        paths:
          - src/ManagedDrive.App/**
