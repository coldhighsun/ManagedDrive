name: CI / Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  # ── Build & Test ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # MinVer needs full git history for tag resolution

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Audit for vulnerable packages
        run: |
          $output = dotnet list package --vulnerable --include-transitive 2>&1
          $output | Write-Output
          if ($output -match "has the following vulnerable packages") {
            throw "Vulnerable package(s) detected - see output above."
          }
        shell: pwsh

      - name: Test
        run: dotnet test --no-build -c Release -- --report-xunit-trx --report-xunit-trx-filename results.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/results.trx'

  # ── Release ──────────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write         # needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Publish app (win-x64, framework-dependent)
        run: |
          dotnet publish src/ManagedDrive.App/ManagedDrive.App.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -o publish-fx/
        shell: pwsh

      - name: Publish CLI (win-x64, framework-dependent)
        run: |
          dotnet publish src/ManagedDrive.Cli/ManagedDrive.Cli.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -o publish-fx/
        shell: pwsh

      - name: Publish helper service (win-x64, framework-dependent)
        run: |
          dotnet publish src/ManagedDrive.Service/ManagedDrive.Service.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -o publish-fx/
        shell: pwsh

      - name: Publish wingetx (win-x64, framework-dependent)
        run: |
          dotnet publish src/ManagedDrive.WingetExtension/ManagedDrive.WingetExtension.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -o publish-fx/
        shell: pwsh

      - name: Resolve version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v1.2.3 or v1.2.3-beta.1
          $version = $tag.TrimStart('v')
          # A SemVer pre-release suffix (the "-beta.1" part) marks the tag as a test build,
          # matching UpdateCheckService.TryParseVersion, which deliberately fails to parse
          # hyphen-suffixed tags so they're never offered as an update.
          $isPrerelease = $version.Contains('-')
          echo "tag=$tag"   >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "is_prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build portable package
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path publish-fx\* -DestinationPath "ManagedDrive-$tag-win-x64-portable.zip"
        shell: pwsh

      - name: Prepare installer inputs
        run: |
          Copy-Item -Path publish-fx -Destination installer\publish-fx -Recurse
          Invoke-WebRequest `
            -Uri "https://github.com/winfsp/winfsp/releases/download/v2.2B4/winfsp-2.2.26215.msi" `
            -OutFile "installer\winfsp-2.2.26215.msi"
        shell: pwsh

      - name: Verify WinFsp MSI checksum
        # Pins the download to the exact bytes we've tested against; bump this hash
        # deliberately (alongside the URL above) when upgrading the bundled WinFsp version.
        run: |
          $expectedHash = "2ECB5C89405488A95BBD8A01875E02C48534FD37BBDFD84488F7590464D65944"
          $actualHash = (Get-FileHash "installer\winfsp-2.2.26215.msi" -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "WinFsp MSI checksum mismatch: expected $expectedHash, got $actualHash"
          }
        shell: pwsh

      - name: Install Inno Setup
        # Chocolatey's "innosetup" package tops out at 6.x; JRSoftware.InnoSetup.7 is the
        # separate winget package for Inno Setup 7. "--scope machine" keeps the install
        # location predictable (windows-latest runners already ship Inno Setup 6 under
        # Program Files (x86), so a version-specific, non-wildcard lookup is required below).
        # "--source winget" restricts the search to the community repo and skips updating
        # the msstore source, which otherwise fails on runners with an unmet Microsoft Store
        # terms-of-transaction/region-detection agreement (0x8a15000f).
        run: winget install --id JRSoftware.InnoSetup.7 --source winget --scope machine --silent --accept-package-agreements --accept-source-agreements
        shell: pwsh

      - name: Build installer
        run: |
          $iscc = Get-ChildItem -Path "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" `
            -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like "*Inno Setup 7*" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            throw "ISCC.exe (Inno Setup 7) not found after installing it."
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\ManagedDrive.iss
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ManagedDrive ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: |
            ManagedDrive-${{ steps.version.outputs.tag }}-win-x64-portable.zip
            installer/Output/ManagedDrive-Setup-${{ steps.version.outputs.version }}.exe
